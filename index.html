<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elke Dag</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f5c4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elke Dag">
<link rel="apple-touch-icon" sizes="180x180" href="ring-180.png">
<link rel="icon" type="image/png" href="ring-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Layout: één kolom, groene kop met voortgangsring, kaarten eronder, tabbalk onderaan */
:root{
  --bg:#f3f5f1; --card:#ffffff; --ink:#15231e; --muted:#62736c; --line:#e3e8e2;
  --brand:#0f5c4d; --brand-2:#1d8a72; --on-brand:#ffffff; --soft:#e4f0ec; --warn:#c2621b; --gold:#e3a21a;
  --shadow:0 1px 2px rgba(15,40,30,.06),0 6px 18px rgba(15,40,30,.06);
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --c-teal:#1d8a72; --c-coral:#e0664f; --c-indigo:#5560d6; --c-amber:#d9930f; --c-rose:#d4477d; --c-sky:#2b8fd1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --bg:#0d1412; --card:#17201d; --ink:#e9f1ed; --muted:#93a59d; --line:#26322e;
  --brand:#0b3d33; --brand-2:#3cc19f; --on-brand:#ffffff; --soft:#16302a; --warn:#f0a062; --gold:#f2bf4a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --c-teal:#3cc19f; --c-coral:#f08a74; --c-indigo:#8b93f2; --c-amber:#f0b440; --c-rose:#ee7aa6; --c-sky:#5fb4ec;}}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#0d1412; --card:#17201d; --ink:#e9f1ed; --muted:#93a59d; --line:#26322e;
  --brand:#0b3d33; --brand-2:#3cc19f; --on-brand:#ffffff; --soft:#16302a; --warn:#f0a062; --gold:#f2bf4a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --c-teal:#3cc19f; --c-coral:#f08a74; --c-indigo:#8b93f2; --c-amber:#f0b440; --c-rose:#ee7aa6; --c-sky:#5fb4ec;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font)}
button{font:inherit;color:inherit}
.top{background:linear-gradient(160deg,var(--brand),color-mix(in srgb,var(--brand) 70%,var(--brand-2)));color:var(--on-brand);
  padding:calc(env(safe-area-inset-top) + 20px) max(20px,env(safe-area-inset-right)) 54px max(20px,env(safe-area-inset-left));border-radius:0 0 28px 28px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:16px}
.top h1{font-size:26px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.top .sub{opacity:.8;font-size:14px;margin-top:4px}
main>.h2:first-child{color:rgba(255,255,255,.8);margin-top:0}
.top .txt{flex:1;min-width:0}
.ring{width:84px;height:84px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
main{max-width:560px;margin:-36px auto 0;padding:0 max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 4px -2px}
.small{font-size:13px;color:var(--muted)}
/* gewoonte-kaart */
.habit{display:flex;align-items:center;gap:14px;padding:14px;position:relative;overflow:hidden}
.habit::before{content:"";position:absolute;inset:0;background:var(--hc);opacity:0;transition:opacity .3s}
.habit.done::before{opacity:.08}
.icon{width:48px;height:48px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;background:color-mix(in srgb,var(--hc) 16%,transparent)}
.habit .info{flex:1;min-width:0;position:relative}
.habit .name{font-weight:700;line-height:1.25}
.habit .meta{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--brand-2)}
.pill.late{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.fire{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.check{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--hc);background:transparent;flex:none;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.check svg{width:22px;height:22px;stroke:var(--on-brand);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .3s .05s}
.done .check{background:var(--hc)}
.done .check svg{stroke-dashoffset:0}
.check.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.18)}}
.cam{width:46px;height:46px;border-radius:14px;border:none;background:var(--soft);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.cam svg{width:22px;height:22px;stroke:var(--brand-2);fill:none;stroke-width:2}
.thumb{width:46px;height:46px;border-radius:14px;object-fit:cover;flex:none;cursor:pointer;position:relative;background:var(--line)}
.celebrate{text-align:center;padding:18px}
.celebrate b{display:block;font-size:18px}
/* tabbalk */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));z-index:5}
nav button{flex:1;max-width:130px;border:none;background:none;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand-2)}
nav button:focus-visible,.btn:focus-visible,.check:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}
/* knoppen en formulieren */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:var(--brand-2);color:var(--on-brand);cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--brand-2)}
.btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--line);width:auto;padding:10px 14px;font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 4px}
input[type=text],input[type=time]{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1;min-width:0}
.swatches,.icons{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:var(--c)}
.sw.on{border-color:var(--ink)}
.ic{width:40px;height:40px;border-radius:12px;border:2px solid transparent;background:var(--bg);font-size:20px;cursor:pointer}
.ic.on{border-color:var(--brand-2);background:var(--soft)}
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 0;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--hc,var(--brand-2));border-color:transparent;color:var(--on-brand)}
.quick{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.quick button{border:none;background:var(--soft);color:var(--brand-2);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
select,input[type=date],input[type=number]{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none;min-height:48px}
.dots i.off{opacity:.25}
.anyt{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:14px;color:var(--ink);font-weight:600;cursor:pointer}
.anyt input{width:20px;height:20px;accent-color:var(--brand-2)}
.anybox{padding:12px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);font-size:15px}
button.pill{border:none;cursor:pointer;font:inherit;font-size:12px;font-weight:700}
.attime{padding:4px 8px;border-radius:10px;border:1.5px solid var(--brand-2);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.edit-head{display:flex;align-items:center;gap:12px;cursor:pointer}
.edit-head .name{flex:1;font-weight:700}
.edit-body{margin-top:14px}
.chev{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .2s}
.open .chev{transform:rotate(180deg)}
/* overzicht */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow)}
.tile .v{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.25}
.tile .d{font-size:12px;font-weight:700;margin-top:6px}
.up{color:var(--brand-2)}.down{color:var(--warn)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.legend{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.legend b{font-size:16px}
.insight{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.insight:first-of-type{border-top:none;padding-top:2px}
.insight .e{font-size:22px;width:32px;text-align:center;flex:none}
.insight b{display:block}
.hrow{display:flex;align-items:center;gap:12px}
.hrow .icon{width:40px;height:40px;font-size:20px;border-radius:12px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:var(--hc);border-radius:99px}
.pct{font-weight:800;font-variant-numeric:tabular-nums;font-size:18px}
.dots{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin-top:10px}
.dots i{aspect-ratio:1;border-radius:2px;background:var(--line);max-width:100%}
.dots i.on{background:var(--hc)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;margin-top:8px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--line)}
.heatwrap{display:flex;gap:6px}
.heatdays{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;margin-top:8px;font-size:9px;color:var(--muted)}
.heatdays span{display:flex;align-items:center}
.demo{background:color-mix(in srgb,var(--gold) 16%,var(--card));border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center}
.demo button{border:none;background:var(--card);border-radius:10px;padding:8px 10px;font-weight:700;font-size:13px;cursor:pointer;flex:none}
/* foto's */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:16px;overflow:hidden}
.gallery figure{margin:0;position:relative;aspect-ratio:1;background:var(--line);cursor:pointer}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery figcaption{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.empty{text-align:center;color:var(--muted);padding:34px 16px}
.empty .big{font-size:44px;margin-bottom:6px}
#viewer{position:fixed;inset:0;background:rgba(5,10,8,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);color:#fff}
#viewer img{max-width:100%;max-height:80%;border-radius:12px}
#viewer p{margin:12px 0 0;text-align:center;font-weight:600}
.banner{background:var(--card);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);cursor:pointer}
.banner .e{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--gold) 20%,transparent);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}

.updbar{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:20;border:none;border-radius:14px;padding:14px;font:inherit;font-weight:700;background:var(--gold);color:#1d1600;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="txt"><h1 id="title">Elke Dag</h1><div class="sub" id="subtitle"></div></div><div class="ring" id="ring" hidden></div></div></header>
<main id="main"></main>
<nav>
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>Vandaag</button>
  <button data-tab="overview"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Overzicht</button>
  <button data-tab="photos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>Foto's</button>
  <button data-tab="habits"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2"/></svg>Gewoontes</button>
</nav>
<div id="viewer"><img alt=""><p id="viewerCap"></p></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<script src="app.js?v=13"></script>
</body>
</html>
